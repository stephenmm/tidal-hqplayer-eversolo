<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" role="img" aria-label="Signal flow inside the reSpeaker XVF3800: the capture path carries the beamformed microphone signal to the host with 58 ms of delay, the playback path carries far-end audio from the host to the loudspeaker, the two never connect inside the device, and a tap on the I2S beam output could feed an external DAC and balanced line driver"><style>
.hdr{font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.13em;fill:#5c6e73}
.ref{font:500 11px 'DejaVu Sans Mono',Menlo,monospace;fill:#101a1e}
.val{font:10px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.pin{font:11px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.rail{font:10px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.note,.lbl{font:10.5px 'Helvetica Neue',Arial,sans-serif;fill:#5c6e73}
</style><rect width="720" height="430" fill="#f6f8f8"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#101a1e"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0c6f7c"/></marker></defs><text x="24.0" y="22.0" text-anchor="start" class="hdr">WHICH WAY EACH STREAM RUNS</text><text x="24.0" y="38.0" text-anchor="start" class="note">The microphone path and the loudspeaker path are separate, and they run in opposite directions.</text><text x="24.0" y="72.0" text-anchor="start" class="hdr" fill="#0c6f7c">CAPTURE &#8212; your room to the far end</text><rect x="24.0" y="80.0" width="92.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="70.0" y="100.0" text-anchor="middle" class="ref">talker</text><text x="70.0" y="113.0" text-anchor="middle" class="val">your room</text><line x1="116.0" y1="102.0" x2="148.0" y2="102.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><rect x="148.0" y="80.0" width="84.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="190.0" y="100.0" text-anchor="middle" class="ref">4 mics</text><text x="190.0" y="113.0" text-anchor="middle" class="val">PDM</text><line x1="232.0" y1="102.0" x2="264.0" y2="102.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><rect x="264.0" y="80.0" width="150.0" height="44.0" rx="2" fill="none" stroke="#0c6f7c" stroke-width="1.4"/><text x="339.0" y="100.0" text-anchor="middle" class="ref">XVF3800</text><text x="339.0" y="113.0" text-anchor="middle" class="val">beamformer + AEC</text><line x1="414.0" y1="102.0" x2="452.0" y2="102.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><text x="433.0" y="92.0" text-anchor="middle" class="val" fill="#0c6f7c">beam</text><rect x="452.0" y="80.0" width="104.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="504.0" y="100.0" text-anchor="middle" class="ref">USB IN</text><text x="504.0" y="113.0" text-anchor="middle" class="val">or I2S DATA1</text><line x1="556.0" y1="102.0" x2="590.0" y2="102.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><rect x="590.0" y="80.0" width="104.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="642.0" y="100.0" text-anchor="middle" class="ref">host</text><text x="642.0" y="113.0" text-anchor="middle" class="val">PC or MCU</text><text x="356.0" y="140.0" text-anchor="start" class="note" fill="#a94e26">58 ms of delay lives here</text><text x="24.0" y="192.0" text-anchor="start" class="hdr">PLAYBACK &#8212; the far end into your room</text><rect x="590.0" y="200.0" width="104.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="642.0" y="220.0" text-anchor="middle" class="ref">host</text><text x="642.0" y="233.0" text-anchor="middle" class="val">PC or MCU</text><line x1="590.0" y1="222.0" x2="556.0" y2="222.0" stroke="#101a1e" stroke-width="1.4" marker-end="url(#ar)"/><rect x="452.0" y="200.0" width="104.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="504.0" y="220.0" text-anchor="middle" class="ref">USB OUT</text><text x="504.0" y="233.0" text-anchor="middle" class="val">or I2S DATA0</text><line x1="452.0" y1="222.0" x2="414.0" y2="222.0" stroke="#101a1e" stroke-width="1.4" marker-end="url(#ar)"/><rect x="264.0" y="200.0" width="150.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="339.0" y="220.0" text-anchor="middle" class="ref">DAC</text><text x="339.0" y="233.0" text-anchor="middle" class="val">TLV320AIC3104</text><line x1="264.0" y1="222.0" x2="232.0" y2="222.0" stroke="#101a1e" stroke-width="1.4" marker-end="url(#ar)"/><rect x="120.0" y="200.0" width="112.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="176.0" y="220.0" text-anchor="middle" class="ref">jack / speaker</text><text x="176.0" y="233.0" text-anchor="middle" class="val">3.5 mm, JST</text><line x1="120.0" y1="222.0" x2="88.0" y2="222.0" stroke="#101a1e" stroke-width="1.4" marker-end="url(#ar)"/><rect x="24.0" y="200.0" width="64.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="56.0" y="226.0" text-anchor="middle" class="ref">room</text><text x="339.0" y="260.0" text-anchor="middle" class="note">carries the far end, never the beam</text><polyline points="300.0,124.0 300.0,200.0" fill="none" stroke="#101a1e" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="291" y1="153.0" x2="309" y2="171.0" stroke="#a94e26" stroke-width="2.2"/><line x1="309" y1="153.0" x2="291" y2="171.0" stroke="#a94e26" stroke-width="2.2"/><text x="318.0" y="166.0" text-anchor="start" class="note" fill="#a94e26">no route inside the chip</text><polyline points="24.0,272.0 410.0,272.0" fill="none" stroke="#101a1e" stroke-width="1.4" stroke-dasharray="4 4"/><text x="24.0" y="292.0" text-anchor="start" class="hdr" fill="#0c6f7c">WHAT YOU COULD BUILD &#8212; tap the beam off I2S</text><circle cx="573.0" cy="102.0" r="2.6" fill="#0c6f7c"/><polyline points="573.0,102.0 573.0,300.0 223.0,300.0 223.0,324.0" fill="none" stroke="#0c6f7c" stroke-width="1.4"/><rect x="148.0" y="324.0" width="150.0" height="44.0" rx="2" fill="none" stroke="#0c6f7c" stroke-width="1.4"/><text x="223.0" y="344.0" text-anchor="middle" class="ref">I2S DATA1</text><text x="223.0" y="357.0" text-anchor="middle" class="val">the beam, PCM</text><line x1="298.0" y1="346.0" x2="330.0" y2="346.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><rect x="330.0" y="324.0" width="116.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="388.0" y="344.0" text-anchor="middle" class="ref">I2S DAC</text><text x="388.0" y="357.0" text-anchor="middle" class="val">PCM5102A</text><line x1="446.0" y1="346.0" x2="478.0" y2="346.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><rect x="478.0" y="324.0" width="120.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="538.0" y="344.0" text-anchor="middle" class="ref">line driver</text><text x="538.0" y="357.0" text-anchor="middle" class="val">THAT 1646</text><line x1="598.0" y1="346.0" x2="630.0" y2="346.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><text x="638.0" y="350.0" text-anchor="start" class="ref" fill="#0c6f7c">XLR</text><text x="148.0" y="390.0" text-anchor="start" class="note">A standalone box with a real balanced output and no computer in the audio path.</text><text x="148.0" y="404.0" text-anchor="start" class="note" fill="#a94e26">It does not reduce the 58 ms: that delay is inside the XVF3800, upstream of the tap.</text></svg>