<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 284" width="700" role="img" aria-label="Schematic of a proof-of-concept microphone channel: an electret capsule with a bias resistor and coupling capacitor feeding an audio interface microphone input with phantom power switched off"><style>
.hdr{font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.13em;fill:#5c6e73}
.ref{font:500 11px 'DejaVu Sans Mono',Menlo,monospace;fill:#101a1e}
.val{font:10px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.pin{font:11px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.rail{font:10px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.note,.lbl{font:10.5px 'Helvetica Neue',Arial,sans-serif;fill:#5c6e73}
</style><rect width="700" height="284" fill="#f6f8f8"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#101a1e"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0c6f7c"/></marker></defs><text x="24.0" y="24.0" text-anchor="start" class="hdr">PROOF-OF-CONCEPT CHANNEL &#8212; ELECTRET INTO AN AUDIO INTERFACE</text><text x="24.0" y="40.0" text-anchor="start" class="note">Hand-solderable throughout. No MEMS, no converters and no clock on the breadboard &#8212; which is what makes it buildable.</text><line x1="100" y1="92" x2="100" y2="83" stroke="#101a1e" stroke-width="1.4"/><line x1="90" y1="83" x2="110" y2="83" stroke="#101a1e" stroke-width="1.8"/><text x="100.0" y="77.0" text-anchor="middle" class="rail">+5 V</text><polyline points="100.0,92.0 100.0,103.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><rect x="94.0" y="103.0" width="12" height="30" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="89.0" y="116.0" text-anchor="end" class="ref">R1</text><text x="89.0" y="127.0" text-anchor="end" class="val">2k2</text><polyline points="100.0,133.0 100.0,150.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><circle cx="100.0" cy="150.0" r="2.6" fill="#101a1e"/><circle cx="100" cy="190" r="20" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="100.0" y="194.0" text-anchor="middle" class="ref">MK1</text><polyline points="100.0,150.0 100.0,170.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><polyline points="100.0,210.0 100.0,226.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><line x1="100" y1="226" x2="100" y2="233" stroke="#101a1e" stroke-width="1.4"/><line x1="91" y1="233" x2="109" y2="233" stroke="#101a1e" stroke-width="1.6"/><line x1="94.5" y1="237" x2="105.5" y2="237" stroke="#101a1e" stroke-width="1.6"/><line x1="98" y1="241" x2="102" y2="241" stroke="#101a1e" stroke-width="1.6"/><text x="100.0" y="262.0" text-anchor="middle" class="note">electret capsule</text><polyline points="100.0,150.0 176.0,150.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><line x1="186" y1="141" x2="186" y2="159" stroke="#101a1e" stroke-width="1.6"/><line x1="194" y1="141" x2="194" y2="159" stroke="#101a1e" stroke-width="1.6"/><text x="190.0" y="136.0" text-anchor="middle" class="ref">C1</text><text x="190.0" y="174.0" text-anchor="middle" class="val">1u</text><text x="179.0" y="154.0" text-anchor="middle" class="val">+</text><polyline points="194.0,150.0 232.0,150.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><rect x="232.0" y="144.0" width="30" height="12" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="247.0" y="140.0" text-anchor="middle" class="ref">R2</text><text x="247.0" y="170.0" text-anchor="middle" class="val">100R</text><polyline points="262.0,150.0 300.0,150.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><circle cx="285.0" cy="150.0" r="2.6" fill="#101a1e"/><rect x="279.0" y="167.0" width="12" height="30" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="296.0" y="180.0" text-anchor="start" class="ref">R3</text><text x="296.0" y="191.0" text-anchor="start" class="val">10k</text><polyline points="285.0,150.0 285.0,167.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><polyline points="285.0,197.0 285.0,214.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><line x1="285" y1="214" x2="285" y2="221" stroke="#101a1e" stroke-width="1.4"/><line x1="276" y1="221" x2="294" y2="221" stroke="#101a1e" stroke-width="1.6"/><line x1="279.5" y1="225" x2="290.5" y2="225" stroke="#101a1e" stroke-width="1.6"/><line x1="283" y1="229" x2="287" y2="229" stroke="#101a1e" stroke-width="1.6"/><line x1="300.0" y1="150.0" x2="340.0" y2="150.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><rect x="344.0" y="116.0" width="150.0" height="68.0" rx="2" fill="none" stroke="#0c6f7c" stroke-width="1.4"/><text x="419.0" y="148.0" text-anchor="middle" class="ref">audio interface</text><text x="419.0" y="161.0" text-anchor="middle" class="val">mic input</text><text x="419.0" y="206.0" text-anchor="middle" class="note" fill="#a94e26">PHANTOM POWER OFF</text><text x="524.0" y="126.0" text-anchor="start" class="note">One interface samples every channel</text><text x="524.0" y="142.0" text-anchor="start" class="note">simultaneously &#8212; the only property</text><text x="524.0" y="158.0" text-anchor="start" class="note">the array actually needs.</text><text x="524.0" y="174.0" text-anchor="start" class="note"></text><text x="524.0" y="190.0" text-anchor="start" class="note">Its own latency is irrelevant:</text><text x="524.0" y="206.0" text-anchor="start" class="note">validation happens offline.</text></svg>