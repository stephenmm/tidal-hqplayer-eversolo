<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 388" width="700" role="img" aria-label="Power tree: a 12 V input feeding switching regulators for the digital rails and linear regulators for the analogue rails, with a separate isolated supply post-filtered for the balanced line driver"><style>
.hdr{font:600 10px 'Helvetica Neue',Arial,sans-serif;letter-spacing:.13em;fill:#5c6e73}
.ref{font:500 11px 'DejaVu Sans Mono',Menlo,monospace;fill:#101a1e}
.val{font:10px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.pin{font:11px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.rail{font:10px 'DejaVu Sans Mono',Menlo,monospace;fill:#5c6e73}
.note,.lbl{font:10.5px 'Helvetica Neue',Arial,sans-serif;fill:#5c6e73}
</style><rect width="700" height="388" fill="#f6f8f8"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#101a1e"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0c6f7c"/></marker></defs><text x="24.0" y="24.0" text-anchor="start" class="hdr">POWER TREE</text><text x="24.0" y="40.0" text-anchor="start" class="note">Microphone PSRR is about -60 dB, so supply ripple lands almost directly in the audio:</text><text x="24.0" y="54.0" text-anchor="start" class="note">analogue rails are linear-regulated and the switchers stay on the far side of the split.</text><rect x="24.0" y="96.0" width="96.0" height="44.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="72.0" y="116.0" text-anchor="middle" class="ref">12 V in</text><text x="72.0" y="129.0" text-anchor="middle" class="val">fuse + TVS</text><polyline points="120.0,118.0 160.0,118.0 160.0,272.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><circle cx="160.0" cy="96.0" r="2.6" fill="#101a1e"/><polyline points="160.0,96.0 196.0,96.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><rect x="196.0" y="76.0" width="116.0" height="40.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="254.0" y="94.0" text-anchor="middle" class="ref">U40  buck</text><text x="254.0" y="107.0" text-anchor="middle" class="val">3V3 digital</text><line x1="312.0" y1="96.0" x2="348.0" y2="96.0" stroke="#101a1e" stroke-width="1.4" marker-end="url(#ar)"/><rect x="352.0" y="76.0" width="122.0" height="40.0" rx="2" fill="none" stroke="#101a1e" stroke-width="1.4"/><text x="413.0" y="94.0" text-anchor="middle" class="ref">U41  buck</text><text x="413.0" y="107.0" text-anchor="middle" class="val">1V1 core</text><line x1="474.0" y1="96.0" x2="510.0" y2="96.0" stroke="#101a1e" stroke-width="1.4" marker-end="url(#ar)"/><text x="518.0" y="100.0" text-anchor="start" class="val">DSP core and I/O</text><circle cx="160.0" cy="176.0" r="2.6" fill="#101a1e"/><polyline points="160.0,176.0 196.0,176.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><rect x="196.0" y="156.0" width="116.0" height="40.0" rx="2" fill="none" stroke="#0c6f7c" stroke-width="1.4"/><text x="254.0" y="174.0" text-anchor="middle" class="ref">U42  LDO</text><text x="254.0" y="187.0" text-anchor="middle" class="val">5V0 analogue</text><line x1="312.0" y1="176.0" x2="348.0" y2="176.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><rect x="352.0" y="156.0" width="122.0" height="40.0" rx="2" fill="none" stroke="#0c6f7c" stroke-width="1.4"/><text x="413.0" y="174.0" text-anchor="middle" class="ref">U43  LDO</text><text x="413.0" y="187.0" text-anchor="middle" class="val">3V3 analogue</text><line x1="474.0" y1="176.0" x2="510.0" y2="176.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><text x="518.0" y="180.0" text-anchor="start" class="val">16 microphones</text><circle cx="160.0" cy="272.0" r="2.6" fill="#101a1e"/><polyline points="160.0,272.0 196.0,272.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><rect x="196.0" y="252.0" width="116.0" height="40.0" rx="2" fill="none" stroke="#0c6f7c" stroke-width="1.4"/><text x="254.0" y="270.0" text-anchor="middle" class="ref">U44  DC-DC</text><text x="254.0" y="283.0" text-anchor="middle" class="val">&#177;15 V</text><line x1="312.0" y1="272.0" x2="348.0" y2="272.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><rect x="352.0" y="252.0" width="122.0" height="40.0" rx="2" fill="none" stroke="#0c6f7c" stroke-width="1.4"/><text x="413.0" y="270.0" text-anchor="middle" class="ref">U45/46  LDO</text><text x="413.0" y="283.0" text-anchor="middle" class="val">&#177;12 V</text><line x1="474.0" y1="272.0" x2="510.0" y2="272.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><text x="518.0" y="276.0" text-anchor="start" class="val">balanced line driver</text><circle cx="330.0" cy="176.0" r="2.6" fill="#101a1e"/><polyline points="330.0,196.0 330.0,216.0" fill="none" stroke="#101a1e" stroke-width="1.4"/><line x1="330.0" y1="216.0" x2="366.0" y2="216.0" stroke="#0c6f7c" stroke-width="1.4" marker-end="url(#ara)"/><text x="374.0" y="220.0" text-anchor="start" class="val">16 preamps</text><text x="518.0" y="152.0" text-anchor="start" class="note" fill="#0c6f7c">linear, no switcher in the analogue path</text><text x="518.0" y="300.0" text-anchor="start" class="note">LC post-filter: a 100-500 kHz switcher</text><text x="518.0" y="314.0" text-anchor="start" class="note">is out of band, but its harmonics</text><text x="518.0" y="328.0" text-anchor="start" class="note">intermodulate if they are let through</text><polyline points="24.0,356.0 676.0,356.0" fill="none" stroke="#101a1e" stroke-width="1.4" stroke-dasharray="4 4"/><text x="24.0" y="374.0" text-anchor="start" class="note">AGND and DGND meet at a single point beneath U1, the first ADC.</text></svg>